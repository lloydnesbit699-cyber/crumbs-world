<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Crumbs HUD — Tile Painter</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; background: #111; color: #eee;
               font-family: system-ui, -apple-system, sans-serif;
               touch-action: manipulation; overscroll-behavior: none; }
  button, select, input { font-size: 16px; padding: 10px 12px; border-radius: 10px;
                         border: 1px solid #444; background: #2a2a2a; color: #eee;
                         min-height: 44px; }
  button:active { background: #3d3d3d; }
  button.on { background: #6b4d1a; border-color: #c9973f; }
  button.danger { background: #4a1f1f; border-color: #a03a3a; }
  .seg { display: flex; border: 1px solid #444; border-radius: 10px; overflow: hidden; }
  .seg button { border: none; border-radius: 0; flex: 1; }
  .seg button + button { border-left: 1px solid #444; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 8px; }
  .row:last-child { margin-bottom: 0; }
  .field { display: flex; gap: 6px; align-items: center; }
  .field input, .field select { min-width: 0; }
  input[type=number] { width: 76px; }
  input[type=text] { width: 150px; }

  /* v2.0: map-first layout — the map owns the whole screen, everything else
     lives in sliding trays and a dropdown menu */
  #topbar { position: fixed; top: 0; left: 0; right: 0; height: 48px; z-index: 45;
            background: #1a1a1a; border-bottom: 1px solid #333;
            display: flex; align-items: center; gap: 8px; padding: 0 8px;
            padding-top: env(safe-area-inset-top); }
  #menu-btn { font-size: 20px; padding: 4px 12px; min-height: 0; line-height: 1.4; }
  #title { font-size: 15px; font-weight: 600; }
  #title small { color: #888; font-weight: normal; font-size: 11px; }

  #menu-dropdown { position: fixed; top: 52px; right: 8px; z-index: 60; background: #222;
                   border: 1px solid #444; border-radius: 12px; padding: 6px;
                   display: none; min-width: 210px;
                   box-shadow: 0 8px 24px rgba(0,0,0,.5); }
  #menu-dropdown.open { display: block; }
  #menu-dropdown button { display: block; width: 100%; text-align: left; border: none;
                         background: none; margin: 2px 0; min-height: 44px; }
  #menu-dropdown button:active { background: #333; }
  #menu-dropdown #btn-stop { color: #ff8a8a; }
  #menu-dropdown hr { border: none; border-top: 1px solid #333; margin: 6px 0; }

  /* v2.2: the map is positioned with a transform, not scroll — panning works
     identically at every zoom level, no browser scroll quirks */
  #stage { position: fixed; top: 48px; left: 0; right: 0; bottom: 0; overflow: hidden;
           background: #0a0a0a; touch-action: none; }
  canvas { position: absolute; left: 0; top: 0; display: block; touch-action: none;
           image-rendering: pixelated; will-change: transform; }

  .edge-tab { position: fixed; top: 50%; transform: translateY(-50%); z-index: 35;
              background: rgba(42,42,42,.92); border: 1px solid #444; color: #eee;
              padding: 16px 7px; font-size: 11px; letter-spacing: 1px; cursor: pointer;
              min-height: 0; writing-mode: vertical-rl; }
  #tab-left { left: 0; border-radius: 0 12px 12px 0; border-left: none; }
  #tab-right { right: 0; border-radius: 12px 0 0 12px; border-right: none; }

  .tray { position: fixed; top: 48px; bottom: 0; width: min(80vw, 320px); z-index: 55;
          background: #161616; padding: 12px; overflow-y: auto;
          transition: transform .22s ease-out; -webkit-overflow-scrolling: touch; }
  #tray-left { left: 0; border-right: 1px solid #333; transform: translateX(-103%); }
  #tray-right { right: 0; border-left: 1px solid #333; transform: translateX(103%); }
  .tray.open { transform: none; }
  .tray-head { font-size: 14px; font-weight: 600; margin-bottom: 10px; color: #ccc; }
  .tray-hint { font-weight: normal; color: #777; font-size: 11px; margin-left: 6px; }
  #tray-left .seg { margin-bottom: 10px; }
  #tray-right button { width: 100%; margin-bottom: 8px; }

  .sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 55;
           background: #161616; border-top: 1px solid #333;
           border-radius: 16px 16px 0 0;
           padding: 12px 12px calc(12px + env(safe-area-inset-bottom));
           max-height: 72dvh; overflow-y: auto; transform: translateY(103%);
           transition: transform .22s ease-out;
           -webkit-overflow-scrolling: touch; }
  .sheet.open { transform: none; }
  .sheet .grab { width: 40px; height: 4px; border-radius: 2px; background: #444;
                 margin: 0 auto 10px; }
  #load-list button { display: block; width: 100%; text-align: left;
                      margin-bottom: 6px; padding: 10px 12px; }
  #load-list button.cur { border-color: #4da3ff; color: #4da3ff; }
  .lbl { color: #888; font-size: 12px; margin-right: 6px; }
  #map-name { color: #eee; font-size: 14px; word-break: break-all; }

  #scrim { position: fixed; inset: 0; z-index: 50; background: rgba(0,0,0,.45);
           display: none; }
  #scrim.on { display: block; }

  #zoom-cluster { position: fixed; right: 10px;
                  bottom: calc(10px + env(safe-area-inset-bottom));
                  z-index: 30; display: flex; flex-direction: column; gap: 8px; }
  #zoom-cluster button { width: 52px; height: 52px; border-radius: 50%; padding: 0;
                        font-size: 20px; background: rgba(42,42,42,.92); }
  #zoom-cluster #btn-pan { font-size: 12px; border-radius: 14px; height: auto;
                          padding: 9px 0; }

  #palette-old { display: none; }
  #tile-palette .grp-label, #collide-palette .grp-label { font-size: 12px; color: #999;
      margin: 6px 2px 4px; text-transform: capitalize; }
  .swatches { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px;
              -webkit-overflow-scrolling: touch; }
  .sw { flex: 0 0 auto; width: 56px; text-align: center; }
  .sw .chip { width: 48px; height: 48px; margin: 0 auto; border-radius: 10px;
              border: 2px solid #555; }
  .sw .chip img { width: 100%; height: 100%; border-radius: 8px; image-rendering: pixelated;
                  display: block; object-fit: contain; background: #0a0a0a; }
  .sw.sel .chip { border-color: #ffd75f; box-shadow: 0 0 8px #ffd75f; }
  .sw .lbl { font-size: 10px; color: #bbb; margin-top: 2px; word-break: break-word; }
  #collide-palette { display: none; gap: 8px; }
  #collide-palette .sw .chip { border-style: dashed; }
  #save-status { color: #888; font-size: 12px; }
  #toast { position: fixed; left: 50%; bottom: 96px; transform: translateX(-50%);
           background: #222; border: 1px solid #555; border-radius: 12px;
           padding: 10px 16px; font-size: 14px; display: none; z-index: 70;
           max-width: 90vw; text-align: center; }
  #dbg { position: fixed; right: 8px; bottom: 8px; max-width: 92vw; z-index: 99;
         background: #3a1010; color: #ffb3b3; border: 1px solid #a03a3a;
         border-radius: 8px; padding: 8px 10px; font: 11px monospace;
         white-space: pre-wrap; word-break: break-word; display: none; }
  @media (max-width: 520px) {
    button, select, input { font-size: 15px; padding: 8px 10px; min-height: 40px; }
    #menu-dropdown button { min-height: 44px; }
  }
</style>
</head>
<body>

<div id="topbar">
  <button id="menu-btn" title="Menu">&#9776;</button>
  <span id="title">Crumbs HUD <small>tile painter &middot; v2.3</small></span>
</div>

<div id="menu-dropdown">
  <button id="btn-play" title="Walk the map">&#9654; Play</button>
  <button id="btn-undo" title="Undo">Undo</button>
  <button id="btn-redo" title="Redo">Redo</button>
  <hr>
  <button id="menu-setup">Setup&hellip;</button>
  <button id="menu-save">Save</button>
  <button id="menu-saveas">Save As&hellip;</button>
  <button id="menu-load">Load&hellip;</button>
  <hr>
  <button id="btn-stop" class="danger" title="Stop the HUD server">Stop server</button>
</div>

<div id="stage"><canvas id="grid"></canvas></div>

<button class="edge-tab" id="tab-left" title="Tile palette">TILES</button>
<button class="edge-tab" id="tab-right" title="Tools">TOOLS</button>

<aside class="tray" id="tray-left">
  <div class="tray-head">Tiles<span class="tray-hint">pick one, then tap the map</span></div>
  <div class="seg" id="layer-seg">
    <button data-layer="tiles" class="on">Tiles</button>
    <button data-layer="objects">Objects</button>
    <button data-layer="collision">Collision</button>
  </div>
  <div id="tile-palette"></div>
  <div id="collide-palette">
    <div class="grp-label">collision</div>
    <div class="swatches">
      <div class="sw" data-cv="1"><div class="chip" style="background:#c0392b"></div><div class="lbl">solid</div></div>
      <div class="sw" data-cv="0"><div class="chip" style="background:#222"></div><div class="lbl">clear</div></div>
    </div>
  </div>
</aside>

<aside class="tray" id="tray-right">
  <div class="tray-head">Tools</div>
  <button id="btn-eraser" title="Eraser">Eraser</button>
  <button id="btn-clear" class="danger" title="Clear current layer">Clear layer</button>
</aside>

<div id="sheet-setup" class="sheet">
  <div class="grab"></div>
  <div class="tray-head">Setup</div>
  <div class="row">
    <div class="field">
      <select id="biome"></select>
      <input id="seed" type="number" placeholder="seed" title="Seed (blank = random)">
      <button id="btn-gen">Generate</button>
    </div>
  </div>
  <div class="row">
    <div class="field">
      <span class="lbl">Map file:</span><b id="map-name">hud_map.json</b>
    </div>
    <div class="field">
      <input id="rw" type="number" value="25" min="4" max="64" title="Width">
      <span>&times;</span>
      <input id="rh" type="number" value="15" min="4" max="64" title="Height">
      <button id="btn-resize">Resize</button>
    </div>
  </div>
  <div class="row">
    <small id="save-status">not saved yet</small>
  </div>
</div>

<div id="sheet-load" class="sheet">
  <div class="grab"></div>
  <div class="tray-head">Load map</div>
  <div id="load-list"></div>
</div>

<div id="scrim"></div>

<div id="zoom-cluster">
  <button id="zoom-out" title="Zoom out">&minus;</button>
  <button id="zoom-in" title="Zoom in">+</button>
  <button id="zoom-fit" title="Fit map to screen">Fit</button>
  <button id="btn-pan" title="Pan the map instead of painting">Move</button>
</div>

<div id="toast"></div>
<div id="dbg"></div>

<script>
"use strict";
// ---- v1.3 remote debug: mirror page errors to the server terminal + on-page
(function () {
  const dbg = document.getElementById("dbg");
  function show(msg) {
    dbg.style.display = "block";
    dbg.textContent = "JS: " + msg + "\n(tap to hide)";
  }
  dbg.onclick = () => { dbg.style.display = "none"; };
  function report(msg, src, line, col, stack) {
    show(String(msg).slice(0, 200) + " @ " + (src || "") + ":" + (line || "?"));
    try {
      fetch("/api/jslog", {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ msg: String(msg).slice(0, 300),
          src: String(src || "").slice(0, 120), line: line || 0,
          col: col || 0, stack: String(stack || "").slice(0, 500) })
      }).catch(function () { /* server unreachable — on-page panel still shows it */ });
    } catch (e) { /* sync failure — on-page panel still shows it */ }
  }
  window.onerror = (msg, src, line, col, err) =>
    report(msg, src, line, col, err && err.stack);
  window.addEventListener("unhandledrejection", e => {
    const r = e.reason || {};
    report("unhandled rejection: " + (r.message || r), "", 0, 0, r.stack);
  });
  if (location.protocol === "file:") {
    show("opened as a file — serve it instead: run crumbs_hud.py, then open http://127.0.0.1:8778");
  }
})();
const $ = id => document.getElementById(id);
const canvas = $("grid"), ctx = canvas.getContext("2d");
const stage = $("stage");

let W = 25, H = 15;                 // map dims from server
let tiles = [], objects = [], coll = [];
let palette = [];                   // [{id,name,color}]
let spriteTiles = [];               // [{id,name,type,category}] image/animation tiles
let thumbImg = {};                  // tile id -> preloaded Image thumbnail
let colorOf = {};                   // tile id -> css color
let layer = "tiles";
let erasing = false;
let selTile = null;                 // selected tile id (tiles/objects layers)
let selCollide = true;              // collision brush value
let tilePx = 32;
let manualZoom = false;   // v1.5: until the user zooms, tiles auto-fit the screen
function fitTiles() {
  if (manualZoom || !W) return;
  const w = $("stage").clientWidth - 16;
  if (w > 0) tilePx = Math.max(8, Math.min(40, Math.floor(w / W)));
}
window.addEventListener("resize", () => { fitTiles(); clampPan(); render(); });
// v2.2 camera: the canvas is absolutely positioned; layout() centers it in
// the stage and applies the pan offset. No scroll container is involved, so
// dragging behaves the same at every zoom level.
function clampPan() {
  const sw = stage.clientWidth, sh = stage.clientHeight;
  const mx = (sw + W * tilePx) / 2, my = (sh + H * tilePx) / 2;
  panX = Math.max(-mx, Math.min(mx, panX));
  panY = Math.max(-my, Math.min(my, panY));
}
function layout() {
  const baseX = (stage.clientWidth - W * tilePx) / 2;
  const baseY = (stage.clientHeight - H * tilePx) / 2;
  canvas.style.transform = "translate(" + (baseX + panX) + "px," + (baseY + panY) + "px)";
}
function zoomAt(clientX, clientY, newPx) {
  newPx = Math.max(8, Math.min(64, newPx));
  if (newPx === tilePx || !W) return;
  const r = stage.getBoundingClientRect();
  const ax = clientX - r.left, ay = clientY - r.top;
  const baseX = (stage.clientWidth - W * tilePx) / 2 + panX;
  const baseY = (stage.clientHeight - H * tilePx) / 2 + panY;
  const tx = (ax - baseX) / tilePx, ty = (ay - baseY) / tilePx;
  tilePx = newPx;
  panX = ax - tx * tilePx - (stage.clientWidth - W * tilePx) / 2;
  panY = ay - ty * tilePx - (stage.clientHeight - H * tilePx) / 2;
  clampPan(); render();
}
let stroke = null;                  // {cells:Map, layer}
let panMode = false, panStart = null;   // v1.7 camera: pan instead of paint
let panX = 0, panY = 0;                 // v2.2: canvas offset in px, relative to centered
const ptrs = new Map();                 // v2.1: active pointers for gestures
let gesture = null;                     // v2.1: two-finger pan/pinch state
let playMode = false, hero = null, heroTimer = null;

async function api(path, body) {
  // v1.4: iOS freezes the server when a-Shell backgrounds; a fetch that dies
  // mid-freeze throws "Load failed". Retry a few times before giving up —
  // all our endpoints are idempotent so a retry is always safe.
  const opt = { headers: { "Content-Type": "application/json" } };
  if (body !== undefined) { opt.method = "POST"; opt.body = JSON.stringify(body); }
  let lastErr = null;
  for (let attempt = 0; attempt < 3; attempt++) {
    try {
      const r = await fetch(path, opt);
      return await r.json();
    } catch (e) {
      lastErr = e;
      await new Promise(res => setTimeout(res, 400 * (attempt + 1)));
    }
  }
  throw lastErr;
}
function toast(msg) {
  const t = $("toast");
  t.textContent = msg; t.style.display = "block";
  clearTimeout(t._h); t._h = setTimeout(() => t.style.display = "none", 2200);
}

async function refresh() {
  const m = await api("/api/map");
  W = m.width; H = m.height;
  tiles = m.tiles; objects = m.objects; coll = m.collision;
  $("rw").value = W; $("rh").value = H;
  fitTiles();
  render();
}

function cellColor(x, y) {
  const id = tiles[y][x];
  return colorOf[id] || "#000";
}

function render() {
  // v1.5: thumbnails can finish loading before /api/map returns — don't
  // crash on the empty grid, just wait for refresh() to draw for real.
  if (!tiles.length || tiles.length < H) return;
  canvas.width = W * tilePx; canvas.height = H * tilePx;
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
    const id = tiles[y][x];
    const im = thumbImg[id];
    if (im && im.complete && im.naturalWidth) {
      ctx.drawImage(im, x * tilePx, y * tilePx, tilePx, tilePx);
    } else {
      ctx.fillStyle = colorOf[id] || "#000";
      ctx.fillRect(x * tilePx, y * tilePx, tilePx, tilePx);
    }
  }
  // collision overlay (always on in play mode so you can see walls)
  if (layer === "collision" || playMode) {
    ctx.strokeStyle = "rgba(255,80,80,0.9)"; ctx.lineWidth = 2;
    for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) if (coll[y][x]) {
      const px = x * tilePx, py = y * tilePx;
      ctx.beginPath(); ctx.moveTo(px, py); ctx.lineTo(px + tilePx, py + tilePx);
      ctx.moveTo(px + tilePx, py); ctx.lineTo(px, py + tilePx); ctx.stroke();
    }
  }
  // hero marker in play mode
  if (playMode && hero) {
    const cx = hero.x * tilePx + tilePx / 2, cy = hero.y * tilePx + tilePx / 2, r = tilePx * 0.32;
    ctx.fillStyle = "#ffd75f"; ctx.strokeStyle = "#000"; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
  }
  // object markers
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
    const oid = objects[y][x];
    if (oid !== null && oid !== undefined) {
      const oim = thumbImg[oid];
      if (oim && oim.complete && oim.naturalWidth) {
        ctx.drawImage(oim, x * tilePx, y * tilePx, tilePx, tilePx);
      } else {
      const cx = x * tilePx + tilePx / 2, cy = y * tilePx + tilePx / 2, r = tilePx * 0.28;
      ctx.fillStyle = colorOf[oid] || "#fff";
      ctx.strokeStyle = "#000"; ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(cx, cy - r); ctx.lineTo(cx + r, cy); ctx.lineTo(cx, cy + r); ctx.lineTo(cx - r, cy);
      ctx.closePath(); ctx.fill(); ctx.stroke();
      }
    }
  }
  // grid lines
  ctx.strokeStyle = "rgba(0,0,0,0.25)"; ctx.lineWidth = 1;
  ctx.beginPath();
  for (let x = 0; x <= W; x++) { ctx.moveTo(x * tilePx + .5, 0); ctx.lineTo(x * tilePx + .5, H * tilePx); }
  for (let y = 0; y <= H; y++) { ctx.moveTo(0, y * tilePx + .5); ctx.lineTo(W * tilePx, y * tilePx + .5); }
  ctx.stroke();
  layout();   // v2.2: re-center + apply pan offset after every draw
}

// ---- painting -------------------------------------------------------------
function evCell(e) {
  const r = canvas.getBoundingClientRect();
  const x = Math.floor((e.clientX - r.left) / tilePx);
  const y = Math.floor((e.clientY - r.top) / tilePx);
  if (x < 0 || y < 0 || x >= W || y >= H) return null;
  return { x, y };
}
function brushValue() {
  if (layer === "collision") return erasing ? false : selCollide;
  if (layer === "objects")   return erasing ? null  : selTile;
  return erasing ? 0 : selTile;
}
function localGrid() { return layer === "objects" ? objects : layer === "collision" ? coll : tiles; }

function strokeAdd(cell) {
  const key = cell.x + "," + cell.y;
  if (stroke.cells.has(key)) return;
  stroke.cells.set(key, { x: cell.x, y: cell.y, tile_id: brushValue() });
  localGrid()[cell.y][cell.x] = brushValue();   // optimistic preview
  dirtyFlag = true;   // v2.0: assume unsaved until the server says otherwise
  render();
}
canvas.addEventListener("pointerdown", e => {
  e.preventDefault();
  ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY });
  try { canvas.setPointerCapture(e.pointerId); } catch (_) {}
  if (ptrs.size === 2) {
    // v2.1: second finger down — drop any in-progress paint, gesture takes over
    gesture = null;
    if (stroke) { stroke = null; refresh(); }
    panStart = null;
    return;
  }
  if (ptrs.size > 2) return;
  if (panMode) {  // v2.2: single-finger drag pans via transform offset
    panStart = { x: e.clientX, y: e.clientY, px: panX, py: panY };
    return;
  }
  const cell = evCell(e); if (!cell) return;
  if (playMode) { playTap(cell); return; }
  stroke = { cells: new Map(), layer };
  strokeAdd(cell);
});
// v2.2: two fingers on the map — drag pans, pinch zooms around the fingers
function onGestureMove() {
  const p = [...ptrs.values()];
  if (p.length < 2) return;
  const dist = Math.hypot(p[0].x - p[1].x, p[0].y - p[1].y);
  const mid = { x: (p[0].x + p[1].x) / 2, y: (p[0].y + p[1].y) / 2 };
  if (!gesture) { gesture = { startDist: dist, startPx: tilePx, lastMid: mid }; return; }
  const newPx = Math.max(8, Math.min(64, gesture.startPx * dist / gesture.startDist));
  if (newPx !== tilePx) { manualZoom = true; zoomAt(mid.x, mid.y, newPx); }
  panX += mid.x - gesture.lastMid.x;
  panY += mid.y - gesture.lastMid.y;
  clampPan(); layout();
  gesture.lastMid = mid;
}
canvas.addEventListener("pointermove", e => {
  if (ptrs.has(e.pointerId)) ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (ptrs.size >= 2) { e.preventDefault(); onGestureMove(); return; }
  if (panMode) {
    if (!panStart) return;
    e.preventDefault();
    panX = panStart.px + (e.clientX - panStart.x);
    panY = panStart.py + (e.clientY - panStart.y);
    clampPan(); layout();
    return;
  }
  if (!stroke) return;
  e.preventDefault();
  const cell = evCell(e); if (cell) strokeAdd(cell);
});
async function endStroke() {
  if (panMode) { panStart = null; return; }
  if (!stroke) return;
  const s = stroke; stroke = null;
  if (!s.cells.size) return;
  const r = await api("/api/stroke", { layer: s.layer, cells: [...s.cells.values()] });
  if (!r.ok) { toast("paint failed"); await refresh(); }
  // server is source of truth; light re-sync keeps undo/redo exact
  await refresh();
}
canvas.addEventListener("pointerup", e => {
  ptrs.delete(e.pointerId);
  if (ptrs.size < 2) gesture = null;
  if (ptrs.size === 0) endStroke();
});
canvas.addEventListener("pointercancel", e => {
  ptrs.delete(e.pointerId);
  gesture = null; stroke = null; panStart = null; refresh();
});

// v1.7 camera: Move toggles pan mode, -/+ zoom, Fit re-fits the screen
$("btn-pan").onclick = () => {
  panMode = !panMode;
  $("btn-pan").classList.toggle("on", panMode);
  toast(panMode ? "move mode — drag the map to pan" : "paint mode");
};

// ---- playtest ---------------------------------------------------------------
async function playTap(cell) {
  if (heroTimer) return;  // let the current walk finish first
  const r = await api("/api/play/move", { x: cell.x, y: cell.y });
  if (!r.ok) { toast("play failed"); return; }
  const path = r.path || [];
  if (!path.length) { toast("can't reach that tile"); return; }
  let i = 0;
  heroTimer = setInterval(() => {
    hero = { x: path[i][0], y: path[i][1] };
    i++; render();
    if (i >= path.length) { clearInterval(heroTimer); heroTimer = null; }
  }, 140);
}
$("btn-play").onclick = async () => {
  if (!playMode) {
    const r = await api("/api/play/start", {});
    if (!r.ok) { toast("play failed"); return; }
    playMode = true; hero = { x: r.x, y: r.y };
    $("btn-play").classList.add("on");
    toast("play mode — tap a tile to walk there");
  } else {
    await api("/api/play/stop", {});
    playMode = false; hero = null;
    if (heroTimer) { clearInterval(heroTimer); heroTimer = null; }
    $("btn-play").classList.remove("on");
    toast("back to editing");
  }
  render();
};

// ---- palette ---------------------------------------------------------------
const BIOME_ORDER = ["dungeon", "grassland", "desert", "arctic", "forest", "ocean"];
function biomeOf(name) {
  for (const b of BIOME_ORDER) if (name.startsWith(b + "_")) return b;
  return "core";
}
function shortName(name) {
  const b = biomeOf(name);
  return b === "core" ? name : name.slice(b.length + 1);
}
function buildPalette() {
  colorOf = {};
  palette.forEach(t => colorOf[t.id] = t.color);
  const box = $("tile-palette"); box.innerHTML = "";
  const groups = { core: [] };
  BIOME_ORDER.forEach(b => groups[b] = []);
  palette.forEach(t => groups[biomeOf(t.name)].push(t));
  ["core", ...BIOME_ORDER].forEach(g => {
    if (!groups[g].length) return;
    const lab = document.createElement("div");
    lab.className = "grp-label"; lab.textContent = g;
    box.appendChild(lab);
    const row = document.createElement("div");
    row.className = "swatches";
    groups[g].forEach(t => {
      const d = document.createElement("div");
      d.className = "sw" + (t.id === selTile ? " sel" : "");
      d.title = t.name + " (#" + t.id + ")";
      d.innerHTML = '<div class="chip" style="background:' + t.color + '"></div>' +
                    '<div class="lbl">' + shortName(t.name) + "</div>";
      d.onclick = () => { selTile = t.id; erasing = false; $("btn-eraser").classList.remove("on"); buildPalette(); };
      row.appendChild(d);
    });
    box.appendChild(row);
  });
  if (spriteTiles.length) {
    const lab = document.createElement("div");
    lab.className = "grp-label"; lab.textContent = "sprites";
    box.appendChild(lab);
    const row = document.createElement("div");
    row.className = "swatches";
    spriteTiles.forEach(t => {
      const d = document.createElement("div");
      d.className = "sw" + (t.id === selTile ? " sel" : "");
      d.title = t.name + " (#" + t.id + " · " + t.type + ")";
      d.innerHTML = '<div class="chip"><img src="/api/thumb/' + t.id + '" alt=""></div>' +
                    '<div class="lbl">' + t.name + "</div>";
      d.onclick = () => { selTile = t.id; erasing = false; $("btn-eraser").classList.remove("on"); buildPalette(); };
      row.appendChild(d);
    });
    box.appendChild(row);
  }
  $("tile-palette").style.display = layer === "collision" ? "none" : "block";
  $("collide-palette").style.display = layer === "collision" ? "block" : "none";
}

// ---- toolbar wiring ----------------------------------------------------------
document.querySelectorAll("#layer-seg button").forEach(b => {
  b.onclick = () => {
    document.querySelectorAll("#layer-seg button").forEach(x => x.classList.remove("on"));
    b.classList.add("on"); layer = b.dataset.layer; buildPalette(); render();
  };
});
$("btn-eraser").onclick = () => {
  erasing = !erasing;
  $("btn-eraser").classList.toggle("on", erasing);
  toast(erasing ? "eraser on" : "eraser off");
};
$("btn-undo").onclick = async () => { const r = await api("/api/undo", {}); if (!r.ok) toast("nothing to undo"); await refresh(); };
$("btn-redo").onclick = async () => { const r = await api("/api/redo", {}); if (!r.ok) toast("nothing to redo"); await refresh(); };
$("btn-clear").onclick = async () => {
  if (!confirm("Clear the " + layer + " layer? (undoable)")) return;
  await api("/api/clear_layer", { layer }); await refresh(); toast("layer cleared");
};
function zoomCenter(d) {
  manualZoom = true;
  const r = stage.getBoundingClientRect();
  zoomAt(r.left + r.width / 2, r.top + r.height / 2, tilePx + d);
}
$("zoom-in").onclick  = () => zoomCenter(8);
$("zoom-out").onclick = () => zoomCenter(-8);
$("zoom-fit").onclick = () => { manualZoom = false; panX = 0; panY = 0; fitTiles(); render(); toast("fit to screen"); };
$("btn-gen").onclick = async () => {
  const seedRaw = $("seed").value.trim();
  const r = await api("/api/generate", { biome: $("biome").value, seed: seedRaw === "" ? null : parseInt(seedRaw, 10) });
  if (r.ok) { await refresh(); toast("generated " + r.biome); } else toast("generate failed");
};
// ---- v2.3: explicit Save / Save As / Load ------------------------------------
let currentFile = "hud_map.json";
function setFile(name) {
  currentFile = name;
  $("map-name").textContent = name;
}
async function doSave() {
  const r = await api("/api/save", { filename: currentFile });
  if (r.ok) { setFile(r.file); toast("saved " + r.file); pollStatus(); }
  else toast("save failed");
}
async function doSaveAs() {
  const name = prompt("Save map as\u2026", currentFile);
  if (name === null) return;   // cancelled
  const r = await api("/api/save", { filename: name.trim() || currentFile });
  if (r.ok) { setFile(r.file); toast("saved " + r.file); pollStatus(); }
  else toast("save failed");
}
async function renderLoadList() {
  const list = $("load-list");
  list.innerHTML = "";
  try {
    const m = await api("/api/maps");
    if (!m.maps.length) list.innerHTML = "<small>no saved maps yet</small>";
    m.maps.forEach(f => {
      const b = document.createElement("button");
      b.textContent = f;
      if (f === currentFile) b.classList.add("cur");
      b.onclick = async () => {
        const r = await api("/api/load", { filename: f });
        if (r.ok) { setFile(f); panX = 0; panY = 0; await refresh(); closeOverlays(); toast("loaded " + f); }
        else toast("load failed: " + (r.error || ""));
      };
      list.appendChild(b);
    });
  } catch (e) { list.innerHTML = "<small>couldn't reach server</small>"; }
}
$("btn-resize").onclick = async () => {
  const r = await api("/api/resize", { width: parseInt($("rw").value, 10), height: parseInt($("rh").value, 10) });
  if (r.ok) { panX = 0; panY = 0; await refresh(); toast("resized " + r.width + "x" + r.height + " \u2014 map kept"); }
};
// v1.8: stop the server from the page — saves first, then your a-Shell prompt comes back
$("btn-stop").onclick = async () => {
  if (!confirm("Stop the HUD server? The page goes dead until you restart it.")) return;
  try { await api("/api/shutdown", {}); } catch (e) { /* server is going away */ }
  toast("server stopping — restart it in a-Shell when ready");
};
document.querySelectorAll("#collide-palette .sw").forEach(d => {
  d.onclick = () => {
    selCollide = d.dataset.cv === "1"; erasing = false; $("btn-eraser").classList.remove("on");
    document.querySelectorAll("#collide-palette .sw").forEach(x => x.classList.remove("sel"));
    d.classList.add("sel");
  };
});

// ---- v2.0 trays & dropdown menu ------------------------------------------------
function closeOverlays() {
  document.querySelectorAll(".tray.open, .sheet.open, #menu-dropdown.open")
    .forEach(el => el.classList.remove("open"));
  $("scrim").classList.remove("on");
}
function toggleOverlay(id) {
  const el = $(id);
  const wasOpen = el.classList.contains("open");
  closeOverlays();
  if (!wasOpen) { el.classList.add("open"); $("scrim").classList.add("on"); }
}
$("menu-btn").onclick = () => toggleOverlay("menu-dropdown");
$("tab-left").onclick = () => toggleOverlay("tray-left");
$("tab-right").onclick = () => toggleOverlay("tray-right");
$("scrim").onclick = closeOverlays;
$("menu-setup").onclick = () => toggleOverlay("sheet-setup");
$("menu-save").onclick = () => { closeOverlays(); doSave(); };
$("menu-saveas").onclick = () => { closeOverlays(); doSaveAs(); };
$("menu-load").onclick = () => { toggleOverlay("sheet-load"); renderLoadList(); };
// dismiss the menu after any of its action buttons fire
$("menu-dropdown").addEventListener("click", e => {
  const b = e.target.closest("button");
  if (b && !["menu-setup", "menu-save", "menu-saveas", "menu-load"].includes(b.id)) setTimeout(closeOverlays, 60);
});

// ---- v2.0: catch unsaved work before the tab closes ---------------------------
// If the map is dirty and the tab gets closed or refreshed, the browser pops
// its "leave site?" prompt instead of silently dropping the player's work.
let dirtyFlag = false;
window.addEventListener("beforeunload", e => {
  if (dirtyFlag) { e.preventDefault(); e.returnValue = ""; }
});

// ---- save status -------------------------------------------------------------

async function pollStatus() {
  try {
    const s = await api("/api/status");
    dirtyFlag = !!s.dirty;   // v2.0: server is the source of truth
    $("save-status").textContent = s.dirty ? "● unsaved changes"
      : (s.last_save ? "saved " + s.last_save : "no changes yet");
  } catch (e) { /* server away */ }
}

// ---- init ----------------------------------------------------------------------
(async function init() {
  try {
    const b = await api("/api/biomes");
    b.biomes.forEach(x => {
      const o = document.createElement("option");
      o.value = x.id; o.textContent = x.name; $("biome").appendChild(o);
    });
    $("biome").value = "dungeon";
    const p = await api("/api/palette");
    palette = p.tiles;
    selTile = palette.length ? palette[0].id : null;
    const s = await api("/api/sprites");
    spriteTiles = s.tiles;
    spriteTiles.forEach(t => {
      const im = new Image();
      im.onload = () => render();
      im.src = "/api/thumb/" + t.id;
      thumbImg[t.id] = im;
    });
    document.querySelector('#collide-palette .sw[data-cv="1"]').classList.add("sel");
    buildPalette();
    setFile(currentFile);
    await refresh();
    pollStatus();
    setInterval(pollStatus, 10000);
  } catch (e) {
    toast("can't reach the HUD server — is crumbs_hud.py running?");
  }
})();
</script>
</body>
</html>
